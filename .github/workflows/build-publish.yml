# Multi-architecture build-and-publish workflow for the rootless ioBroker
# container image. (Task 16.1)
#
# Trigger model:
#   - Pushed git tag matching `<version>-r<n>` (e.g. `7.2.2-r2`, NO leading `v`)
#     -> BUILD + PUBLISH (multi-arch manifest push).
#   - Pull requests / pushes to main -> BUILD-ONLY (both arches, gate runs, no push).
#   - workflow_dispatch              -> manual dry-run BUILD-ONLY (no push).
#
# Versioning scheme (see docs): the git tag is the source of truth and is
# identical to the immutable image tag, e.g. `7.2.2-r2`, where:
#   - `7.2.2` is the bundled iobroker.js-controller version (the thing users
#     track); it bumps when js-controller is bumped.
#   - `-r<n>` is the image REVISION; it bumps on a rebuild of the SAME controller
#     version (base-image patch, Dockerfile change, dependency bump) and resets
#     to `-r1` whenever the controller version changes.
# Node major and Debian codename are NOT in the tag — they are recorded as OCI
# image labels (see the Dockerfile LABEL block), driven by the same build args.
# The publish job derives the moving `<version>` alias (e.g. `7.2.2`) and
# `latest` from this tag.
#
# NODE_MAJOR (from `nodeMajor`) and DEBIAN_CODENAME (from `debianCodename`) are
# read once from the maintainer-owned Build_Config in package.json (the
# `containerImage` key), reusing the same strict derivation as lib/node-major.js
# + lib/build-config.js. The workflow FAILS FAST before any build step in EVERY
# trigger mode when a knob is missing/empty/invalid. (Req 5.4, 5.5, 5.7)
#
# The image is published EXPLICITLY as ghcr.io/<owner>/iobroker (lowercased),
# NOT derived from github.repository (which would give ...iobroker.container-image).
# (Req 1.3)
#
# Per-arch build jobs target the Dockerfile `verify` stage so the
# runtime-dependency verification gate (task 15.1) runs inside each architecture
# build. The publish job pushes the single multi-arch manifest of the shippable
# `runtime` stage, and only after BOTH per-arch build+gate jobs succeed
# (all-or-nothing). (Req 1.1, 1.2, 1.6, 1.8, 2.6, 2.7)

name: build-publish

on:
  push:
    branches:
      - main
    tags:
      # Release tags are `<version>-r<n>` with NO leading `v`, e.g. `7.2.2-r3`.
      - '[0-9]+.[0-9]+.[0-9]+-r[0-9]+'
      # Dev/test tags are `<version>-dev-r<n>`, e.g. `7.2.2-dev-r2`. They build
      # and publish to GHCR under their immutable tag ONLY (no `latest`, no
      # moving `<version>` alias — a dev build must never move the release
      # pointers). base-refresh ignores them.
      - '[0-9]+.[0-9]+.[0-9]+-dev-r[0-9]+'
  pull_request:
    branches:
      - main
  workflow_dispatch:

# Least-privilege: read the repo everywhere; only the publish job additionally
# requests packages:write (declared at the job level).
permissions:
  contents: read

env:
  # Explicit, lowercase GHCR image name: <owner>/iobroker. The owner is
  # normalized to lowercase in the read-build-config job (GHCR requires
  # lowercase names, and github.repository_owner may contain uppercase).
  IMAGE_NAME: iobroker

jobs:
  # ---------------------------------------------------------------------------
  # Fail-fast Build_Config read. Runs in ALL trigger modes and MUST succeed
  # before any build job starts (every build job `needs` this job). If
  # package.json `containerImage.nodeMajor` is missing/empty/invalid, or
  # `debianCodename` is missing/empty, this job fails and no build ever runs.
  # (Req 5.4, 5.5, 5.7)
  # ---------------------------------------------------------------------------
  read-build-config:
    name: Read Build_Config (fail-fast)
    runs-on: ubuntu-latest
    outputs:
      node_major: ${{ steps.read.outputs.node_major }}
      debian_codename: ${{ steps.read.outputs.debian_codename }}
      image: ${{ steps.image.outputs.image }}
      # js-controller version to PIN in the build. On a release-tag push this is
      # the `<version>` parsed from the tag (e.g. `7.2.2`), so the image is built
      # against exactly the controller version the tag claims. On non-tag builds
      # (PRs, main, dispatch) it is `stable` — the normal shipped default — since
      # there is no version to pin. (see `parse-tag` step)
      js_controller_version: ${{ steps.parse-tag.outputs.js_controller_version }}
      # The immutable tag (`<version>-r<n>` or `<version>-dev-r<n>`) on a tag
      # push, else empty.
      release_tag: ${{ steps.parse-tag.outputs.release_tag }}
      # The moving `<version>` alias on a RELEASE tag push, else empty (empty for
      # dev tags, which must not move the alias).
      release_version: ${{ steps.parse-tag.outputs.release_version }}
      # "true" when the pushed tag is a dev/test tag (`<version>-dev-r<n>`), so
      # the publish job can suppress `latest`. "false" otherwise.
      is_dev: ${{ steps.parse-tag.outputs.is_dev }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read NODE_MAJOR and DEBIAN_CODENAME from package.json containerImage
        id: read
        # Reuse the exact strict derivation from lib/node-major.js +
        # lib/build-config.js. Read the maintainer-owned Build_Config from the
        # repo-root package.json `containerImage` key. Fail (exit 1) with a
        # naming error if nodeMajor is missing/empty/invalid or debianCodename is
        # missing/empty — never fall back to a system default. (Req 5.4, 5.5, 5.7)
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { readPackageJson, readDebianCodename } from './lib/build-config.js';
          import { deriveNodeMajorFromPackageJson } from './lib/node-major.js';

          try {
            const pkg = readPackageJson('./package.json');

            const major = deriveNodeMajorFromPackageJson(pkg);

            const codename = readDebianCodename(pkg);
            if (typeof codename !== 'string' || codename.trim().length === 0) {
              throw new Error(
                'Build_Config field `debianCodename` is missing or empty in package.json containerImage.',
              );
            }

            console.log(
              `Read NODE_MAJOR=${major} (nodeMajor), DEBIAN_CODENAME=${codename.trim()} ` +
                `(debianCodename) from package.json containerImage.`,
            );
            appendFileSync(process.env.GITHUB_OUTPUT, `node_major=${major}\n`);
            appendFileSync(process.env.GITHUB_OUTPUT, `debian_codename=${codename.trim()}\n`);
          } catch (err) {
            console.error(`ERROR: ${err && err.message ? err.message : err}`);
            process.exit(1);
          }
          NODE

      - name: Resolve lowercase image reference
        id: image
        # Published image name is set EXPLICITLY as ghcr.io/<owner>/iobroker,
        # NOT github.repository (which would yield ...iobroker.container-image).
        # GHCR names must be lowercase. (Req 1.3)
        run: |
          set -euo pipefail
          owner="$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')"
          echo "image=ghcr.io/${owner}/${IMAGE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Parse release tag -> pinned js-controller version
        id: parse-tag
        # Single source of truth for tag parsing, shared by BOTH the per-arch
        # build+gate and the publish job. The git tag is `<version>-r<n>` (e.g.
        # `7.2.2-r2`) and is identical to the immutable image tag; split off the
        # moving `<version>` alias (`7.2.2`).
        #
        # The `<version>` is passed to the build as JS_CONTROLLER_VERSION so the
        # image is PINNED to exactly the controller version the tag claims —
        # never the drifting `stable` dist-tag. On non-tag builds (PRs, main,
        # dispatch) there is nothing to pin, so it stays `stable` (the normal
        # shipped default). A malformed release tag fails here, before any build.
        run: |
          set -euo pipefail
          ref="${{ github.ref }}"
          name="${{ github.ref_name }}"
          if [[ "$ref" == refs/tags/* ]]; then
            # Two publishable tag shapes, both carrying the same 3-component
            # js-controller `<version>` to pin:
            #   - release:  <version>-r<n>       (e.g. 7.2.2-r3)
            #   - dev/test: <version>-dev-r<n>   (e.g. 7.2.2-dev-r2)
            # A dev tag publishes ONLY its immutable tag: it must NOT move the
            # `latest` or `<version>` release pointers, so `release_version`
            # (the moving alias) is left empty for dev and `is_dev=true` gates
            # `latest` in the publish job. The plain `<version>` release-SIGNAL
            # tag (7.2.2 / 7.2.2.1) is handled by release-promote.yml, never
            # here — it is not a buildable image tag, so reject it explicitly.
            if [[ "$name" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-dev-r[0-9]+$ ]]; then
              version="${BASH_REMATCH[1]}"
              echo "release_tag=${name}" >> "$GITHUB_OUTPUT"
              # No moving alias for dev builds.
              echo "release_version=" >> "$GITHUB_OUTPUT"
              echo "is_dev=true" >> "$GITHUB_OUTPUT"
              echo "js_controller_version=${version}" >> "$GITHUB_OUTPUT"
              echo "Dev tag '${name}' -> pin js-controller '${version}', immutable tag only (no latest/alias)."
            elif [[ "$name" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-r[0-9]+$ ]]; then
              version="${BASH_REMATCH[1]}"
              echo "release_tag=${name}" >> "$GITHUB_OUTPUT"
              echo "release_version=${version}" >> "$GITHUB_OUTPUT"
              echo "is_dev=false" >> "$GITHUB_OUTPUT"
              echo "js_controller_version=${version}" >> "$GITHUB_OUTPUT"
              echo "Release tag '${name}' -> pin js-controller '${version}', alias '${version}', latest."
            else
              echo "::error title=Bad tag::Tag '$name' is not a buildable image tag. Expected <version>-r<n> (e.g. 7.2.2-r3) or <version>-dev-r<n> (e.g. 7.2.2-dev-r2). Plain <version> tags are release SIGNALS handled by release-promote.yml, not built here."
              exit 1
            fi
          else
            echo "release_tag=" >> "$GITHUB_OUTPUT"
            echo "release_version=" >> "$GITHUB_OUTPUT"
            echo "is_dev=false" >> "$GITHUB_OUTPUT"
            echo "js_controller_version=stable" >> "$GITHUB_OUTPUT"
            echo "Non-tag build -> js-controller 'stable' (no pin)."
          fi

  # ---------------------------------------------------------------------------
  # Per-architecture build + runtime-dependency gate. Runs for EVERY trigger
  # (PRs, main, tags, dispatch) with push disabled: it builds each arch and
  # targets the Dockerfile `verify` stage so the runtime-dependency gate runs
  # in-build. A failing arch fails its matrix leg and names the architecture.
  # (Req 1.1, 1.2, 2.6, 2.7)
  # ---------------------------------------------------------------------------
  build-arch:
    name: Build ${{ matrix.arch }} (+ gate)
    needs: read-build-config
    runs-on: ubuntu-latest
    strategy:
      # Do not cancel the other arch when one fails, so the log clearly reports
      # which architecture failed.
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
          - arch: arm64
            platform: linux/arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.arch }} and run runtime-dependency gate
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Single arch per matrix leg so a failure clearly maps to an arch.
          platforms: ${{ matrix.platform }}
          # Target the verify stage so the runtime-dependency gate (task 15.1)
          # executes as part of this build. If the gate fails, the build fails.
          target: verify
          # Build-only: never push from the per-arch validation job.
          push: false
          load: false
          build-args: |
            NODE_MAJOR=${{ needs.read-build-config.outputs.node_major }}
            DEBIAN_CODENAME=${{ needs.read-build-config.outputs.debian_codename }}
            # On a release tag this is the pinned `<version>` (e.g. 7.2.2), so
            # the verify build installs exactly the tagged controller and the
            # Dockerfile version-match check fires here — catching a bad tag
            # BEFORE publish. On non-tag builds it is `stable`.
            JS_CONTROLLER_VERSION=${{ needs.read-build-config.outputs.js_controller_version }}

      - name: Report failing architecture
        if: failure()
        run: |
          echo "::error title=Build failed::Architecture '${{ matrix.arch }}' (${{ matrix.platform }}) failed to build or did not pass the runtime-dependency gate."

  # ---------------------------------------------------------------------------
  # Publish a single multi-arch manifest. Runs ONLY on a pushed release tag
  # (`<version>-r<n>`, e.g. `7.2.2-r2`), and ONLY after BOTH per-arch builds +
  # gates succeed (all-or-nothing). buildx pushes one manifest list referencing
  # both arch variants under the immutable `<version>-r<n>` tag, the moving
  # `<version>` alias, and `latest`. (Req 1.3, 1.6, 1.8)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish multi-arch manifest
    needs:
      - read-build-config
      - build-arch
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          # Explicit image name (NOT github.repository). (Req 1.3)
          images: ${{ needs.read-build-config.outputs.image }}
          tags: |
            # Immutable tag: the exact git tag (`<version>-r<n>` e.g. 7.2.2-r3,
            # or `<version>-dev-r<n>` e.g. 7.2.2-dev-r2) applied to the single
            # multi-arch manifest. Parsed once in the read-build-config job.
            type=raw,value=${{ needs.read-build-config.outputs.release_tag }}
            # Moving alias: `<version>` (e.g. 7.2.2) -> newest revision for that
            # js-controller version. EMPTY for dev tags (release_version is
            # empty), which metadata-action skips, so a dev build never moves
            # the `<version>` pointer.
            type=raw,value=${{ needs.read-build-config.outputs.release_version }}
            # `latest` applied only on RELEASE-tag pushes. For dev tags this is
            # empty (is_dev == true) and metadata-action skips it, so a dev
            # build never moves `latest`.
            type=raw,value=${{ needs.read-build-config.outputs.is_dev == 'true' && '' || 'latest' }}
          labels: |
            # Link the GHCR package (name `iobroker`) back to its source repo.
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            # Record the js-controller version and image revision.
            org.opencontainers.image.version=${{ needs.read-build-config.outputs.release_tag }}

      - name: Build and push single multi-arch manifest
        uses: docker/build-push-action@v6
        with:
          context: .
          # Both platforms in one push -> one manifest list. buildx pushes the
          # manifest only after both platform builds succeed, so no
          # single-arch image is ever published. (Req 1.6, 1.8)
          platforms: linux/amd64,linux/arm64
          # Publish the shippable `runtime` stage (NOT the verify stage, which
          # only adds gate RUN layers). The runtime-dependency gate is still
          # enforced all-or-nothing before this job runs: `publish` needs the
          # per-arch `build-arch` jobs, each of which builds the `verify` target
          # and fails if the gate fails, so no push happens unless BOTH arches
          # passed the gate. (Req 2.6, 2.7, 1.8)
          target: runtime
          push: true
          build-args: |
            NODE_MAJOR=${{ needs.read-build-config.outputs.node_major }}
            DEBIAN_CODENAME=${{ needs.read-build-config.outputs.debian_codename }}
            # Pin the controller to the `<version>` from the release tag so the
            # published image installs exactly what the tag claims, never the
            # drifting `stable` dist-tag.
            JS_CONTROLLER_VERSION=${{ needs.read-build-config.outputs.js_controller_version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
