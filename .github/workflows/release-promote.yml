# Release promotion.
#
# Pushing a plain `<version>` tag is how a maintainer SIGNALS "cut a release":
#   - `<version>`            3 components, e.g. `7.2.2` — release that
#                            js-controller version.
#   - `<version>.<build>`    4 components, e.g. `7.2.2.1` — an image-only
#                            re-release of an already-released js-controller
#                            version (the 4th component is just a nudge and is
#                            NOT part of the 3-component `<version>`).
#
# On such a signal this workflow decides which `<version>-r<n>` RELEASE tag to
# create (via build/scripts/plan-release-tags.sh) and pushes it. That push
# triggers build-publish.yml, which does the actual multi-arch build + publish.
# This workflow only DECIDES and TAGS; it never builds or publishes images.
#
# What it creates (see the script + docs/building.md): a release affects ONLY
# the version the signal refers to. The signal's 3-component `<version>` is
# advanced to its next release revision:
#   - `<version>-r<highest+1>` if a release tag already exists;
#   - `<version>-r1` otherwise (e.g. only `<version>-dev-r<n>` tags exist).
# Other versions are left untouched. Keeping the latest 2 versions current on a
# newer base image is base-refresh.yml's job.
#
# Example: testing 7.2.5 up to 7.2.5-dev-r3 with prior release 7.2.2-r11; push
# `7.2.5` (or `7.2.5.1`) -> creates `7.2.5-r1` only. 7.2.2 is not re-cut.
#
# TOKEN: like base-refresh.yml, the created tags are pushed with the RELEASE_PAT
# secret so build-publish IS triggered (a tag pushed with the default
# GITHUB_TOKEN does not trigger other workflows). Without RELEASE_PAT the tags
# are still created but the job warns that build-publish will not fire
# automatically.

name: release-promote

on:
  push:
    tags:
      # Plain release-signal tags ONLY: 3 or 4 numeric components, NO `-r` /
      # `-dev-r` suffix (those are built by build-publish.yml, not signals).
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, e.g. 7.2.5 (or 7.2.5.2). Only this version gets a new release tag.'
        type: string
        required: true
      dry_run:
        description: 'Only report which release tags would be created; do not push.'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  promote:
    name: Promote the signalled version to a new release revision
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout (full history + tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Push the created tags as the PAT so build-publish is triggered;
          # fall back to the default token (tags created, build-publish NOT
          # triggered -> warning below).
          token: ${{ secrets.RELEASE_PAT || github.token }}

      - name: Plan and create release tags
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          HAS_PAT: ${{ secrets.RELEASE_PAT != '' }}
          # On a tag push the signal is the pushed tag; on a manual run it is
          # the `version` input. Either way it names the ONE version to release.
          SIGNAL: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail

          # The signal (7.2.5 / 7.2.5.2) is a lightweight marker, NOT a
          # buildable image tag. plan-release-tags.sh reduces it to its
          # 3-component `<version>` and plans the next `<version>-r<n>` for
          # that version only.
          if [[ "${{ github.event_name }}" == "push" ]]; then
            echo "Release signal tag pushed: '${SIGNAL}'."
          else
            echo "Manual release-promote run for '${SIGNAL}'."
          fi

          mapfile -t all_tags < <(git tag --list)
          mapfile -t planned < <(build/scripts/plan-release-tags.sh "${SIGNAL}" "${all_tags[@]}")

          if [[ ${#planned[@]} -eq 0 ]]; then
            echo "::error title=No release planned::plan-release-tags.sh produced no tag for '${SIGNAL}'."
            exit 1
          fi

          echo "Planned release tags: ${planned[*]}"

          created_any=0
          for tag in "${planned[@]}"; do
            if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
              # plan-release-tags.sh computes highest+1, so this should not
              # happen; never clobber an existing tag if it does.
              echo "::warning title=Tag exists::'${tag}' already exists; skipping."
              continue
            fi
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo "DRY RUN: would create and push tag '${tag}'."
              continue
            fi
            echo "Creating release tag '${tag}'."
            git tag "${tag}"
            git push origin "refs/tags/${tag}"
            created_any=1
            if [[ "${HAS_PAT}" != "true" ]]; then
              echo "::warning title=build-publish not triggered::Tag '${tag}' was pushed with the default GITHUB_TOKEN, which does NOT trigger build-publish. Configure a RELEASE_PAT secret (contents:write) so the release publishes automatically, or re-push the tag / run build-publish manually."
            fi
          done

          if [[ "${DRY_RUN}" != "true" && "${created_any}" -eq 0 ]]; then
            echo "No new release tags were created."
          fi

      - name: Create GitHub Release for the signal tag
        # A GitHub Release tracks the human-facing CHANGELOG — NOT the
        # per-revision `<version>-r<n>` image tags (those are cut on every
        # rebuild/base-refresh and must not each spawn a release). So the release
        # is created for the plain `<version>` (or `<version>.<build>`) SIGNAL
        # tag the maintainer pushes, exactly the tag that triggered this workflow.
        #
        # Only on a real signal-tag push (not workflow_dispatch, not dry-run).
        # Idempotent: if a release for the tag already exists it is left as-is.
        #
        # Release notes come from the CHANGELOG section for this exact tag, i.e.
        # `## [${SIGNAL_TAG}]` (e.g. `## [7.2.2.1]`). Only if there is no section
        # for the exact tag do we fall back to the 3-component `<version>`
        # section (`## [7.2.2]`), and only if THAT is also absent do we use
        # gh auto-generated notes. This keeps a `7.2.2.1` release scoped to its
        # own CHANGELOG entry rather than pulling in the whole `7.2.2` section.
        # The promote job already has contents:write, which `gh release` needs.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNAL_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if gh release view "${SIGNAL_TAG}" >/dev/null 2>&1; then
            echo "GitHub Release '${SIGNAL_TAG}' already exists; leaving it unchanged."
            exit 0
          fi

          # Extract the CHANGELOG section for an exact `## [<ver>]` header: the
          # lines after that header up to (but not including) the next `## `
          # header. Prints nothing if the header is absent.
          extract_section() {
            awk -v ver="$1" '
              $0 == "## [" ver "]" || index($0, "## [" ver "] ") == 1 { grab=1; next }
              grab && /^## / { exit }
              grab { print }
            ' CHANGELOG.md
          }

          # The 3-component `<version>` (e.g. 7.2.2 from 7.2.2.1) used only as a
          # fallback when the exact-tag section is missing.
          changelog_version="$(printf '%s' "${SIGNAL_TAG}" | cut -d. -f1-3)"

          notes_file="$(mktemp)"
          release_args=(--title "${SIGNAL_TAG}" --verify-tag)
          if extract_section "${SIGNAL_TAG}" > "${notes_file}" && [[ -s "${notes_file}" ]]; then
            echo "Using CHANGELOG section for exact tag '${SIGNAL_TAG}' as release notes."
            release_args+=(--notes-file "${notes_file}")
          elif [[ "${changelog_version}" != "${SIGNAL_TAG}" ]] \
               && extract_section "${changelog_version}" > "${notes_file}" \
               && [[ -s "${notes_file}" ]]; then
            echo "No section for '${SIGNAL_TAG}'; using CHANGELOG section for '${changelog_version}'."
            release_args+=(--notes-file "${notes_file}")
          else
            echo "No CHANGELOG section for '${SIGNAL_TAG}' or '${changelog_version}'; using auto-generated notes."
            release_args+=(--generate-notes)
          fi

          echo "Creating GitHub Release '${SIGNAL_TAG}'."
          gh release create "${SIGNAL_TAG}" "${release_args[@]}"
